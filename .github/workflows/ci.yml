name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WhisperrAI/whisperr-spec
          # Contract v2 fixtures (v2.json, automatic.json pushEventsV2).
          # TEMPORARY: remove this ref once whisperr-spec feat/contract-v2-sdk
          # merges to main.
          ref: feat/contract-v2-sdk
          path: whisperr-spec
      - name: Test
        run: swift test
        env:
          WHISPERR_SPEC_PATH: ${{ github.workspace }}/whisperr-spec/conformance/wire.json
      # With two library products, Xcode names the all-targets scheme
      # "whisperr-swift-Package".
      - name: Build for iOS
        # swift test runs on macOS only; this compiles the UIKit code paths.
        run: xcodebuild -scheme whisperr-swift-Package -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
      - name: Build for iOS Simulator
        run: xcodebuild -scheme whisperr-swift-Package -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
