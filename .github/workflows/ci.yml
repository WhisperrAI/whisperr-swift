name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WhisperrAI/whisperr-spec
          path: whisperr-spec
      - name: Test
        run: swift test
        env:
          WHISPERR_SPEC_PATH: ${{ github.workspace }}/whisperr-spec/conformance/wire.json
      - name: Build for iOS
        # swift test runs on macOS only; this compiles the UIKit code paths.
        run: xcodebuild -scheme whisperr-swift -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
